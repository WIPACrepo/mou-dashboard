[tool.ty.rules]
# Downgraded to warnings (not ignored) rather than fixed outright: `dash>=4.4.1` now ships
# real type stubs (py.typed), where the previously-pinned `dash==2.16.1` did not, so the
# `# type: ignore[import]` comments on `import dash` used to blanket-silence these as `Any`
# under mypy. ty now sees real Dash types and surfaces pre-existing mismatches across the
# web_app callback modules (Dash callbacks declaring e.g. `-> bool`/`-> str` but actually
# receiving `Output(...)`/`Input(...)`/`State(...)` descriptor objects at decoration time,
# and returning dash's `NoUpdate` sentinel where a concrete type is declared) — a real but
# separate follow-up (fixing the Dash callback typing scheme repo-wide), not part of this
# CI/packaging migration. Kept as warnings (not "ignore") so they stay visible in `ty check`
# output for that follow-up, while not failing CI (lint-python.yml runs
# `ty check --exit-zero-on-warning`).
#
# NOTE: a few of these, outside the Dash-callback pattern, look like they could be genuine
# latent bugs rather than Dash-stub noise and are worth a closer look independently of the
# broader cleanup: rest_server/data_sources/mou_db.py:578,589,604 and
# rest_server/utils/utils.py:246 index/assign `dict[str, ...]` using `ObjectId | float`
# values sourced from Mongo documents, where a `str` key is expected.
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-return-type = "warn"
invalid-method-override = "warn"

[tool.pytest.ini_options]

[tool.ruff]
exclude = ["tests", "resources"]

[tool.ruff.lint]
# ruff's default rule selection is very broad (~900 rules); iceprod's pyproject.toml
# (our reference implementation) ignores whole noisy categories to approximate the old
# flake8 scope (pyflakes + pycodestyle) plus E501 (matching this repo's prior
# `flake8-ignore = E501 W503`, W503 has no ruff equivalent since ruff follows PEP 8's
# current stance on line-break-before-binary-operator).
ignore = ["BLE001", "C408", "DTZ", "E501", "LOG015", "PIE", "PLC0206", "RUF", "S", "SIM", "TRY", "UP"]
